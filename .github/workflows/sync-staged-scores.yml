name: Sync staged listening scores

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-staged-listening-scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORMSPREE_STAGING_READ_ONLY_KEY: ${{ secrets.FORMSPREE_STAGING_READ_ONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import Formspree submissions
        if: env.FORMSPREE_STAGING_READ_ONLY_KEY != ''
        run: python -m scores.sync_formspree --api --output scores
      - name: Commit public score archive
        if: env.FORMSPREE_STAGING_READ_ONLY_KEY != ''
        run: |
          if [[ -n $(git status --porcelain -- scores/inbox scores/latest.csv) ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- scores/inbox scores/latest.csv
            git commit -m 'Sync staged listening scores'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - name: Show missing-secret notice
        if: env.FORMSPREE_STAGING_READ_ONLY_KEY == ''
        run: echo 'Set FORMSPREE_STAGING_READ_ONLY_KEY in repository Actions secrets to enable synchronization.'
