name: Sync staged listening scores

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/sync-staged-scores.yml
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-staged-listening-scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORMSPREE_STAGING_READ_ONLY_KEY: ${{ secrets.FORMS1MJY || secrets.FORMSPREE_STAGING_READ_ONLY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Formspree API secret
        run: |
          if [[ -z "$FORMSPREE_STAGING_READ_ONLY_KEY" ]]; then
            echo 'Missing repository Actions secret FORMS1MJY or FORMSPREE_STAGING_READ_ONLY_KEY.' >&2
            exit 1
          fi
      - name: Import Formspree submissions
        # Store only rejection and missing-field counts, never submitted values, in status.
        run: python -m scores.sync_formspree --api --output scores
      - name: Build real-recording analysis
        run: python scores/analyze_real_recording.py
      - name: Commit public score archive
        run: |
          if [[ -n $(git status --porcelain -- scores/inbox scores/latest.csv scores/sync_status.json p808/real12_analysis) ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- scores/inbox scores/latest.csv scores/sync_status.json p808/real12_analysis
            git commit -m 'Sync staged listening scores'
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
