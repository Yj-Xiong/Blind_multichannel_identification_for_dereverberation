<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>L2048 Repeat Listening</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="hero repeat-hero">
      <p class="eyebrow">Dereverberation listening across repeat times</p>
      <h1>Dereverberation Examples of Real Recordings</h1>
    </header>

    <main>
      <section class="panel repeat-controls" id="repeat-examples">
        <label class="filter-control">
          <span>Condition</span>
          <select id="snr-filter" aria-label="Condition selector">
            <option value="snr5">SNR 5 dB</option>
            <option value="snr10">SNR 10 dB</option>
            <option value="clean">noise-free</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Input</span>
          <select id="input-filter" aria-label="Input selector">
            <option value="noisy">Noisy</option>
            <option value="specsub">Spectral-Subtraction</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Corpus</span>
          <select id="corpus-filter" aria-label="Corpus selector">
            <option value="thchs">THCHS</option>
            <option value="timit">TIMIT</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Distance</span>
          <select id="distance-filter" aria-label="Distance selector">
            <option value="1m">1 m</option>
            <option value="2m">2 m</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Regularization</span>
          <select id="lambda-filter" aria-label="Lambda selector">
            <option value="reg005">λ = 0.05</option>
            <option value="reg01">λ = 0.1</option>
            <option value="noreg">λ = 0</option>
          </select>
        </label>
        <label class="filter-control">
          <span>Repeat</span>
          <select id="repeat-filter" aria-label="Repeat selector"></select>
        </label>
        <p class="note" id="repeat-status" aria-live="polite"></p>
      </section>

      <section id="repeat-content" class="repeat-content" aria-label="Repeat listening examples"></section>
    </main>

    <script type="module" src="./src/repeat-listening.js"></script>
  </body>
</html>
